<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSRS Clan Bingo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

      /* ── Shared navy palette (defaults = classic theme) ── */
      :root {
        --c-16213e: #16213e;
        --c-0f3460: #0f3460;
        --c-2d3748: #2d3748;
        --c-1a2a3a: #1a2a3a;
        --c-1a1a2e: #1a1a2e;
      }

      /* ── Beta theme global overrides ── */
      body.beta-theme { background: #000 !important; font-family: 'Pixelify Sans', monospace !important; }
      body.beta-theme {
        --c-16213e: #0d0d0d;
        --c-0f3460: #262626;
        --c-2d3748: #1a1a1a;
        --c-1a2a3a: #262626;
        --c-1a1a2e: #050505;
      }
      body.beta-theme nav {
        background: rgba(15, 15, 20, 0.9) !important;
        border-bottom: none !important;
        margin: 14px 20px 0 !important;
        padding: 1.1rem 2rem !important;
        border-radius: 16px !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        position: sticky !important;
        top: 14px !important;
        z-index: 100 !important;
        gap: 1.75rem !important;
      }
      body.beta-theme nav a { font-size: 1.05rem !important; }
      body.beta-theme nav a:first-child { font-size: 1.4rem !important; }
      body.beta-theme nav a,
      body.beta-theme nav button,
      body.beta-theme nav span {
        text-transform: uppercase !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
